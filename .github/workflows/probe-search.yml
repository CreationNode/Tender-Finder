# TEMPORARY: checks the BOAMP and TED query changes from a runner (the cloud sandbox can't reach
# either). Removed before merge.
name: Probe search sources
on:
  pull_request:
    paths: ["probe-search.mjs", ".github/workflows/probe-search.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node probe-search.mjs
