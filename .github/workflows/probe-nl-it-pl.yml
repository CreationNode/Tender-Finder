name: Probe DE/NO sources (temporary)
on:
  push:
    branches: [probe-nl-it-pl]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: germany-norway }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: |
          set +e
          time node ingest/run.mjs oev || true
          jq -c '.doneDays | length' data/index/oev.state.json
          time node ingest/run.mjs oev || true
          jq -c '{count, notes}' data/index/oev.json
          jq -c '.rows[:4][]' data/index/oev.json
          jq -c '[.rows[] | select(.[6] | test("CPV"))] | length' data/index/oev.json
          jq -c '[.rows[] | select(.[2] == "")] | length' data/index/oev.json
          jq -c '[.rows[] | select(.[7] | test("ui/de/search"))] | length' data/index/oev.json
          jq -r '[.rows[] | .[4]] | sort | .[0], .[-1]' data/index/oev.json
