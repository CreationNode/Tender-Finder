name: Probe NL/IT/PL sources (temporary)
on:
  push:
    branches: [probe-nl-it-pl]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; OpenTenderFinder/1.0; public-interest tender search; +https://github.com/tender-finder)"
          B="https://ezamowienia.gov.pl/mo-board/api/v1/notice?NoticeType=ContractNotice&PublicationDateFrom=2026-09-29T00:00:00&PublicationDateTo=2026-09-29T23:59:59&PageSize=100"
          for p in 1 2 3 30; do
            curl -sS --max-time 90 -A "$UA" "$B&PageNumber=$p" -o /tmp/p$p.json -w "page $p HTTP %{http_code} bytes=%{size_download}\n"
            jq -c '{n: length, types: (group_by(.noticeType) | map({(.[0].noticeType): length}) | add), first: .[0].publicationDate, last: .[-1].publicationDate, firstNo: .[0].bzpNumber, noticeNos: ([.[].noticeNumber] | unique | length), bzps: ([.[].bzpNumber] | unique | length)}' /tmp/p$p.json
            sleep 3
          done
          echo "unique bzpNumber across pages 1-3:"; jq -s 'add | [.[].bzpNumber] | unique | length' /tmp/p1.json /tmp/p2.json /tmp/p3.json
          echo "unique noticeNumber across pages 1-3:"; jq -s 'add | [.[].noticeNumber] | unique | length' /tmp/p1.json /tmp/p2.json /tmp/p3.json
          echo "overlap p1/p2 bzp:"; jq -s '([.[0][].bzpNumber]) - ([.[0][].bzpNumber] - [.[1][].bzpNumber]) | length' /tmp/p1.json /tmp/p2.json
          echo "sample numbers p1:"; jq -r '.[:5][] | "\(.noticeNumber) \(.publicationDate) \(.submittingOffersDate)"' /tmp/p1.json
          echo "sample numbers p30:"; jq -r '.[:5][] | "\(.noticeNumber) \(.publicationDate) \(.submittingOffersDate)"' /tmp/p30.json
