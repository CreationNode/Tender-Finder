name: Probe NL/IT/PL sources (temporary)
on:
  push:
    branches: [probe-nl-it-pl]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: netherlands-poland }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: |
          time node ingest/run.mjs bzp || true
          cat data/index/bzp.state.json
          time node ingest/run.mjs bzp || true
          cat data/index/bzp.state.json
          true
          for s in tenderned bzp; do
            echo "== $s"; ls -la data/index/$s.json
            jq -c '{count, notes}' data/index/$s.json
            jq -c '[.rows[] | select(.[6] != "")] | length' data/index/$s.json
            jq -c '.rows[:3][]' data/index/$s.json
            jq -r '[.rows[] | .[4]] | sort | .[0], .[-1]' data/index/$s.json
          done
          curl -sS -o /dev/null -w "BZP link %{http_code}\n" -A "OpenTenderFinder" "$(jq -r '.rows[0][7]' data/index/bzp.json)"
