name: Probe NL/IT/PL sources (temporary)
on:
  push:
    branches: [probe-nl-it-pl]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          UA="Mozilla/5.0 (compatible; OpenTenderFinder/1.0; public-interest tender search; +https://github.com/tender-finder)"
          A="https://ezamowienia.gov.pl/mo-board/api/v1/notice?NoticeType=ContractNotice&PageSize=100"
          D="PublicationDateFrom=2026-09-29T00:00:00&PublicationDateTo=2026-09-29T23:59:59"
          s() { jq -c '{n: length, first: .[0].publicationDate, last: .[-1].publicationDate, firstNo: .[0].noticeNumber, lastNo: .[-1].noticeNumber, lastObj: .[-1].objectId}' /tmp/r.json 2>/dev/null || head -c 300 /tmp/r.json; echo; sleep 3; }
          get() { echo "== $1"; curl -sS --max-time 90 -A "$UA" "$A&$1" -o /tmp/r.json -w "HTTP %{http_code} bytes=%{size_download}\n"; s; }
          get "$D"; cp /tmp/r.json /tmp/first.json
          OBJ=$(jq -r '.[-1].objectId' /tmp/first.json); NO=$(jq -r '.[-1].bzpNumber' /tmp/first.json | sed 's/ /%20/g'); NN=$(jq -r '.[-1].noticeNumber' /tmp/first.json | sed 's/ /%20/g; s#/#%2F#g'); PD=$(jq -r '.[-1].publicationDate' /tmp/first.json)
          get "$D&SearchAfter=$OBJ"
          get "$D&SearchAfter=$NO"
          get "$D&SearchAfter=$NN"
          get "$D&SearchAfter=$PD"
          # does time of day filter?
          get "PublicationDateFrom=2026-09-29T08:47:35&PublicationDateTo=2026-09-29T23:59:59"
          get "PublicationDateFrom=2026-09-29T12:00:00Z&PublicationDateTo=2026-09-29T23:59:59Z"
          # totals for the day with larger pages
          get "$D&PageSize=1000" 
          jq 'length' /tmp/r.json
