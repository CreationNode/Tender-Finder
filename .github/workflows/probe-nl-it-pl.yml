name: Probe Doffin/TED overlap (temporary)
on:
  push:
    branches: [probe-nl-it-pl]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - env:
          DOFFIN_API_KEY: ${{ secrets.DOFFIN_API_KEY }}
        run: node probe/overlap.mjs
