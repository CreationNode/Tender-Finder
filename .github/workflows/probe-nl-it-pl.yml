name: Probe NL/IT/PL sources (temporary)
on:
  push:
    branches: [probe-nl-it-pl]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: netherlands-poland }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: |
          time node ingest/run.mjs bzp || true
          jq -c '.doneDays' data/index/bzp.state.json
          time node ingest/run.mjs bzp || true
          jq -c '.doneDays' data/index/bzp.state.json
          jq -c '{count, notes}' data/index/bzp.json
          jq -c '[.rows[] | .[5]] | group_by(.) | map({(.[0]): length}) | add' data/index/bzp.json
          jq -c '[.rows[] | .[4]] | group_by(.) | map({(.[0]): length}) | add' data/index/bzp.json
